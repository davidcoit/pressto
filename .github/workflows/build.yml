name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-release
            build_preset: linux-release
            cmake_args: -DCMAKE_BUILD_TYPE=Release
          - os: macos-13
            preset: macos-universal
            build_preset: macos-universal
            cmake_args: -DSMTG_BUILD_EXAMPLES=OFF
          - os: windows-latest
            preset: windows-msvc
            build_preset: windows-msvc-release
            cmake_args: -DSMTG_CREATE_PLUGIN_LINK=OFF

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxtst-dev \
            libfreetype6-dev \
            libxcb-util-dev \
            libxcb-cursor-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-xkb-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libglu1-mesa-dev \
            freeglut3-dev \
            mesa-common-dev \

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build_preset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pressto-${{ matrix.os }}
          path: build/${{ matrix.preset }}/PresstoCompressor_artefacts/
